  <line x1="10" y1="18" x2="18" y2="18" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="21" x2="15" y2="21" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Graduation cap (guru symbol) -->
